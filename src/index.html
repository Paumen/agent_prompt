<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Prompt</title>
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/special.css" />
  </head>

  <body id="app">
    <!-- Card 1: Configuration — expanded on page load -->
    <details class="card" id="card-configuration" open>
      <summary class="card-header">
        <h3>Config</h3>
        <span class="card-meta"></span>
      </summary>
      <div class="card-body" id="bd-configuration">
        <!-- populated by card-configuration.js -->
      </div>
    </details>

    <!-- Card 2: Steps —  -->
    <details class="card" id="card-steps" open>
      <summary class="card-header">
        <h3>Steps</h3>
        <span class="card-meta"></span>
      </summary>
      <div class="card-body" id="bd-steps">
        <!-- populated by card-steps.js -->
      </div>
    </details>

    <!-- Card 4: Prompt — collapsed (never auto-collapses once opened per OUT-08) -->
    <details class="card" id="card-prompt" open>
      <summary class="card-header">
        <h3>Prompt</h3>
        <span class="card-meta"></span>
      </summary>
      <div class="card-body" id="bd-prompt">
        <!-- populated by card-prompt.js -->
      </div>
    </details>

    <script type="module" src="./common/main.js"></script>
  </body>
</html>
