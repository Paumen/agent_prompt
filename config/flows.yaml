# Flow definitions — to be designed in a separate session.
# This file is the single source of truth for task/flow/step configuration.
# Claude implements exactly what is defined here.
#
# --- Vocabulary reference (pool for step definitions) ---
#
# Objects: repository, branch, file, folder, file tree, pull request, issue,
#   commit, PR comments, review comments, labels, diff hunks, CI status.
#
# Operations: read, edit, analyze, validate/test, commit.
#
# Focus Lenses: semantics, syntax, security, performance, structure,
#   dependencies, duplications, redundancies, error handling, naming conventions,
#   test coverage, type safety, documentation completeness, accessibility.
#
# --- Authoring guidelines ---
#
# - PR references use PR number only — don't embed diff content in the prompt.
#   The LLM has GitHub access and can fetch PR data using the number + PAT.
# - Write-oriented flows should instruct the LLM to create a new branch;
#   branch naming is left to the LLM's judgment if not specified by the user.
# - Step granularity should be moderate — assume LLM competence.
#   Don't micro-instruct what it already knows how to do.
#
# --- Generic steps ---
#
# All flows use a subset of these 7 generic steps:
#   context  — Read claude.md / project config
#   read     — Read relevant files, issues, PRs, specs
#   analyze  — Analyze the problem / code / requirements
#   plan     — Plan the approach
#   implement — Make changes (create branch, edit/create files)
#   test     — Run tests / validate
#   commit   — Commit, open draft PR, provide feedback
#   report   — Provide review feedback (review flow only)

# ==================================================
# Anchors for reusable blocks
# ==================================================
_x_anchors:
  # ---------- Generic step anchors ----------

  step_plan: &step_plan
    id: plan
    operation: create
    object: plan
    branch_name: optional_text

  step_test: &step_test
    id: test
    operation: validate
    object: tests
    sources: [panel_a.files]

  step_commit: &step_commit
    id: commit
    operation: commit
    object: changes
    params: { open_draft_pr: true }
    pr_name: optional_text

  # ---------- Common field properties ----------

  text_field: &text_field
    type: text

  file_picker: &file_picker
    type: file_picker_multi

  issue_picker: &issue_picker
    type: issue_picker

  pr_picker: &pr_picker
    type: pr_picker

  lens_picker: &lens_picker
    type: lens_picker

  lens_picker_default_empty: &lens_picker_default_empty
    <<: *lens_picker
    default: []

# ==================================================
# Flows
# ==================================================
flows:
  fix:
    label: 'Debug'
    icon: 'bug'
    prompt_template:
      heading: 'Investigate the issue:'
      panels:
        - panel: panel_a
          tag: undesired_behavior
          fields:
            - { key: description, type: text, label: 'Bug: ' }
            - { key: issue_number, type: issue, label: 'Read issue ' }
            - { key: files, type: files, label: 'Read ' }
        - panel: panel_b
          tag: expected_behavior
          fields:
            - { key: description, type: text, label: 'Expected: ' }
            - { key: spec_files, type: files, label: 'Specs: ' }
            - { key: guideline_files, type: files, label: 'Guidelines: ' }
    panel_a:
      label: 'Current State'
      subtitle: "What's happening now"
      fields:
        description:
          <<: *text_field
          placeholder: 'Describe the issue: error messages, unexpected behavior, what goes wrong...'
    panel_b:
      label: 'Expected Outcome'
      subtitle: 'How it should work after the fix'
      fields:
        description:
          <<: *text_field
          placeholder: 'Describe the expected behavior after the fix is applied...'
    steps:
      - id: read
        operation: read
        object: files
        sources: [panel_a.files, panel_a.issue_number, panel_b.spec_files]
      - id: analyze
        operation: analyze
        object: issue
        lenses: []
      - *step_plan
      - id: edit
        operation: edit
        object: files
      - *step_test
      - *step_commit

  review:
    label: 'Review'
    icon: 'codescan'
    prompt_template:
      heading: 'Review the subject against criteria:'
      panels:
        - panel: panel_a
          tag: review_subject
          fields:
            - { key: pr_number, type: pr, label: 'Review PR ' }
            - { key: files, type: files, label: 'Review ' }
            - { key: description, type: text, label: 'Context: ' }
        - panel: panel_b
          tag: review_criteria
          fields:
            - { key: lenses, type: lenses, label: 'Focus: ' }
            - { key: spec_files, type: files, label: 'Specs: ' }
            - { key: guideline_files, type: files, label: 'Guidelines: ' }
    panel_a:
      label: 'Review Subject'
      subtitle: 'The PR, code, or document to examine'
      fields:
        description:
          <<: *text_field
          placeholder: 'Background, specific questions, or areas of concern...'
    panel_b:
      label: 'Review Criteria'
      subtitle: 'Standards and criteria for the review'
      fields:
        description:
          <<: *text_field
    steps:
      - id: read
        operation: read
        object: files
        sources: [panel_a.pr_number, panel_a.files, panel_b.spec_files]
      - id: analyze
        operation: analyze
        object: code
        lenses: [semantics, structure]
      - id: report
        operation: create
        object: review_feedback
        output:
          [here, pr_comment, pr_inline_comments, issue_comment, report_file]

  implement:
    label: 'Implement'
    icon: 'rocket'
    prompt_template:
      heading: 'Implement per context and requirements:'
      panels:
        - panel: panel_a
          tag: existing_context
          fields:
            - { key: description, type: text, label: 'Context: ' }
            - { key: files, type: files, label: 'Build on: ' }
        - panel: panel_b
          tag: requirements
          fields:
            - { key: description, type: text, label: '', dot: false }
            - { key: spec_files, type: files, label: 'Specs: ' }
            - { key: acceptance_criteria, type: text, label: 'Acceptance: ' }
    panel_a:
      label: 'Context'
      subtitle: 'Existing code or context to build upon (optional)'
      fields:
        description:
          <<: *text_field
          placeholder: 'Background, constraints, or existing context...'
    panel_b:
      label: 'Requirements'
      subtitle: 'What to build and completion criteria'
      fields:
        description:
          <<: *text_field
          placeholder: 'Describe what to build: functionality, behavior, constraints, requirements/spec id...'
    steps:
      - id: read
        operation: read
        object: files
        sources: [panel_a.files, panel_b.spec_files]
      - id: analyze
        operation: analyze
        object: requirements
      - *step_plan
      - id: edit
        operation: create
        object: code
        file_name: optional_text
      - *step_test
      - *step_commit

  improve:
    label: 'refactor'
    icon: 'compose'
    prompt_template:
      heading: 'Improve per current state and desired outcome:'
      panels:
        - panel: panel_a
          tag: current_state
          fields:
            - { key: description, type: text, label: '', dot: false }
            - { key: issue_number, type: issue, label: 'Read issue ' }
            - { key: files, type: files, label: 'Files: ' }
        - panel: panel_b
          tag: desired_outcome
          fields:
            - { key: description, type: text, label: 'Goal: ' }
            - { key: issue_number, type: issue, label: 'Target per issue ' }
            - { key: guideline_files, type: files, label: 'Style reference: ' }
            - { key: lenses, type: lenses, label: 'Focus: ' }
    panel_a:
      label: 'Current State'
      subtitle: 'What exists and what needs improvement'
      fields:
        description:
          <<: *text_field
          placeholder: 'What to enhance: pain points, inefficiencies, areas to improve...'
    panel_b:
      label: 'Desired Outcome'
      subtitle: 'What the improved version should look like'
      fields:
        description:
          <<: *text_field
          placeholder: 'Describe the desired improvements, goals, or constraints...'
    multi_file:
      scope_selector:
        label: 'How should files be improved?'
        options:
          each_file: 'Each file separately'
          across_files: 'Across files together'
        show_when: 'panel_a.files.length >= 2'
    steps:
      - id: read
        operation: read
        object: files
        sources: [panel_a.files, panel_a.issue_number, panel_b.guideline_files]
      - id: analyze
        operation: analyze
        object: improvements
        lenses: []
      - *step_plan
      - id: edit
        operation: edit
        object: files
      - *step_test
      - *step_commit
